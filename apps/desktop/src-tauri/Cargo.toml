[package]
name = "downloader_pro_desktop"
version = "0.1.0"
description = "Downloader Pro desktop shell"
authors = ["you"]
edition = "2021"

[lib]
name = "downloader_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread"] }

# Patch glib 0.18.x for GHSA-wrw7-89jp-8q8g / RUSTSEC-2024-0429 (VariantStrIter UB).
# Tauri 2.x pins gtk-rs 0.18 → glib ^0.18; upstream only fixed glib >= 0.20 (gtk4).
# Remove when Tauri ships GTK4/WebKitGTK 6. See: https://github.com/tauri-apps/tauri/issues/12048
[patch.crates-io]
glib = { git = "https://github.com/shiva-manu/gtk-rs-core.git", rev = "3f8427a8b698b6a599e710fed6e36895b2bbcbef" }
glib-sys = { git = "https://github.com/shiva-manu/gtk-rs-core.git", rev = "3f8427a8b698b6a599e710fed6e36895b2bbcbef" }
glib-macros = { git = "https://github.com/shiva-manu/gtk-rs-core.git", rev = "3f8427a8b698b6a599e710fed6e36895b2bbcbef" }
gobject-sys = { git = "https://github.com/shiva-manu/gtk-rs-core.git", rev = "3f8427a8b698b6a599e710fed6e36895b2bbcbef" }
gio-sys = { git = "https://github.com/shiva-manu/gtk-rs-core.git", rev = "3f8427a8b698b6a599e710fed6e36895b2bbcbef" }
